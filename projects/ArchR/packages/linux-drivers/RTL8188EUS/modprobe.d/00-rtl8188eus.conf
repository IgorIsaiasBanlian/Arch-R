# Prefer the out-of-tree r8188eu driver for RTL8188EUS chipset over
# the in-tree rtl8xxxu (which scans but can't complete WPA2 handshake
# reliably — see archr-linux/Arch-R#19). rtl8xxxu still binds to other
# Realtek USB chips (RTL8192EU, RTL8723BU, etc.), so a blanket
# blacklist of rtl8xxxu would break unrelated dongles.
#
# Default tunables for the out-of-tree driver — IWD does its own MAC
# randomization, power management belongs to mac80211, and we want LED
# blink on activity so users can see the dongle is alive.
options 8188eu rtw_drv_log_level=0 rtw_led_ctrl=1 rtw_power_mgnt=1
